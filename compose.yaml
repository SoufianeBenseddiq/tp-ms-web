services:
  mysql:
    image: mysql:8.4
    container_name: gestion-ecole-mysql
    environment:
      MYSQL_DATABASE: gestion_ecole
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    image: gestion-ecole-backend
    container_name: gestion-ecole-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/gestion_ecole?createDatabaseIfNotExist=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure

volumes:
  mysql-data:
