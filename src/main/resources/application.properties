spring.application.name=gestion-ecole
server.port=${SERVER_PORT:8080}

# --- MySQL (une seule base pour toute la V1 monolithique) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gestion_ecole?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Erreurs au format RFC 7807 (ProblemDetail) ---
spring.mvc.problemdetails.enabled=true
